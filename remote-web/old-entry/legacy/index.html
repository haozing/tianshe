<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>小尊宝兜底入口</title>
    <style>
      :root {
        font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
        color: #1b2b44;
        background: #f4f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(720px, calc(100vw - 32px));
        padding: 28px;
        border: 1px solid #dbe5f2;
        border-radius: 8px;
        background: #fff;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        color: #17396f;
      }

      p {
        margin: 0 0 14px;
        color: #65738a;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        align-items: center;
        height: 34px;
        padding: 0 14px;
        border: 1px solid #5d91f2;
        border-radius: 6px;
        background: #5d91f2;
        color: #fff;
        text-decoration: none;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>小尊宝兜底入口</h1>
      <p>当前新远程 Web 或入口配置不可用。此页面独立部署在旧入口下，用于保证客户端不白屏。</p>
      <p>Phase 0 先提供硬兜底；完整 Legacy App Replica 将继续按路由清单补齐。</p>
      <a href="/old-entry/">重新进入</a>
    </main>
  </body>
</html>
